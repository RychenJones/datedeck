# Netlify builds the React app from frontend/ on every push to main (DD-10a).
# VITE_POCKETBASE_URL is set in Netlify's site settings, not here.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# DD-28: a link to a page that does not exist still loads the app, which shows its Not found
# screen. Real files (like /assets/*) are served first; 404 keeps the right status for browsers.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
